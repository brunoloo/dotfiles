"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "pills"

format = """
[\ue0b6](fg:pink)[ \uf015 ](bg:pink fg:base)[\ue0b4](fg:pink) \
$directory \
$git_branch\
$git_status\
\n$character"""

[palettes.pills]
base = "#1e1e2e"
pink = "#f5c2e7"
mauve = "#cba6f7"
green = "#a6e3a1"
peach = "#fab387"
red = "#f38ba8"

[directory]
format = "[\ue0b6](fg:mauve)[ \uf07b $path ](bg:mauve fg:base)[$read_only](bg:mauve fg:red)[\ue0b4](fg:mauve)"
truncation_length = 3
truncation_symbol = "…/"
read_only = "\uf023 "

[directory.substitutions]
"Documents" = "\U000f0219 Documents"
"Downloads" = "\uf019 Downloads"
"Music" = "\uf001 Music"
"Pictures" = "\uf03e Pictures"

[git_branch]
symbol = "\ue0a0"
format = "[\ue0b6](fg:green)[ $symbol $branch ](bg:green fg:base)[\ue0b4](fg:green) "

[git_status]
format = "([\ue0b6](fg:peach)[ $all_status$ahead_behind ](bg:peach fg:base)[\ue0b4](fg:peach))"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
